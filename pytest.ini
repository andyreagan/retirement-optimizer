[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = backend/tests functional_tests

# Output options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Django settings
DJANGO_SETTINGS_MODULE = retirement_backend.settings
pythonpath = backend

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, API)
    e2e: End-to-end tests (full stack)
    slow: Slow running tests
    skip_ci: Skip in CI environment

# Coverage options
[coverage:run]
source = backend
omit = 
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if settings.DEBUG:
    if TYPE_CHECKING:

[coverage:html]
directory = htmlcov